name: CoolPC Price Tracker

on:
  schedule:
    # GMT+8 23:50 == UTC 15:50
    - cron: '50 15 * * *'
  workflow_dispatch:        # 允許手動觸發

permissions:
  contents: write           # 需要寫入權限才能 push

concurrency:
  group: coolpc-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml

      - name: Run scraper
        run: python scrape.py

      - name: Commit & push if JSON changed
        run: |
          if [[ -z "$(git status --porcelain coolpc_prices.json)" ]]; then
            echo "No changes in coolpc_prices.json, skipping commit."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          TODAY=$(TZ='Asia/Taipei' date +'%Y-%m-%d')
          git add coolpc_prices.json
          git commit -m "chore: update CoolPC prices for ${TODAY}"
          git push